personas:
  - id: PERSONA-001
    name: Practice manager
    description: Runs billing for a three-chair dental practice, one afternoon a week.
    goal: Close the week with every invoice either paid or chased, without opening the bank statement twice.
  - id: PERSONA-002
    name: Bookkeeper
    description: Contract bookkeeper covering eleven small practices, working from exports.
    goal: Reconcile a month of payments against invoices in one sitting and leave a trail anyone can follow.

epics:
  - id: EPIC-002
    title: Payment reconciliation
    persona: PERSONA-001
    requirements: [REQ-030, REQ-031, REQ-032]

requirements:
  - id: REQ-030
    epic: EPIC-002
    persona: PERSONA-001
    source: FLOW-001
    statement: The practice manager raises a refund against a settled payment.
    acceptance_signal: The refund request form takes the payment, the amount, and the date the refund leaves.
    traces_to: []
  - id: REQ-031
    epic: EPIC-002
    persona: PERSONA-002
    source: FLOW-002
    statement: The bookkeeper sees which refunds are awaiting the bank and which have cleared.
    acceptance_signal: The refund status list separates refunds awaiting the bank from refunds that have cleared.
    traces_to: []
  - id: REQ-032
    epic: EPIC-002
    persona: PERSONA-001
    source: FLOW-003
    statement: The practice manager reviews every unmatched payment against open invoices before closing the week.
    acceptance_signal: The reconciliation review screen lists unmatched payments with the open invoices each could settle.
    traces_to: []
