    title: Residency
    scope: Order data stays in one region.
    out_of_scope:
      - The system does not support per-tenant regions.
    success_metric: Rows outside the named region stay at 0.
    requirements: [REQ-019]
  - id: EPIC-002
    title: Offline
    scope: A shopper writes orders offline.
    out_of_scope:
      - The system does not sync media offline.
