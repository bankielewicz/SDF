  - id: REQ-019
    actor: PERSONA-001
    statement: All order data is stored in exactly one region and is not replicated out of it.
    rationale: A data residency rule binds the operator.
    acceptance_signal: An audit of the store finds order rows in one region only.
    priority: should
    source: user
    status: accepted
    open_questions: []
    traces_to: []
  - id: REQ-031
    actor: PERSONA-001
    statement: A shopper writes an order offline and the write is durable before any network round trip.
    rationale: Field staff work without connectivity.
    acceptance_signal: An order written with the network disabled survives a device restart.
    priority: should
    source: user
    status: accepted
