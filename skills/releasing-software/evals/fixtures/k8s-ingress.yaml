apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "checkout"
  labels:
    app: "checkout"
spec:
  rules:
    - host: "checkout.example.invalid"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: "checkout"
                port:
                  number: 80
