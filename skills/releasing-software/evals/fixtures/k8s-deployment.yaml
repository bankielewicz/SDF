apiVersion: apps/v1
kind: Deployment
metadata:
  name: "checkout"
  labels:
    app: "checkout"
    version: "v0.3.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: "checkout"
  template:
    metadata:
      labels:
        app: "checkout"
        version: "v0.3.0"
    spec:
      containers:
        - name: "checkout"
          image: "registry.example.invalid/checkout:v0.3.0"
          ports:
            - containerPort: 8080
          env:
            - name: APP_PORT
              value: "8080"
          envFrom:
            - secretRef:
                name: "checkout-secrets"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
