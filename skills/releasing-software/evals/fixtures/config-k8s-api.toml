schema = "devforgeai/config/1"
generated_at = "2026-09-11T08:40:00Z"
cli_version = "1.0.0"
degraded = false

[[stack]]
id = "primary"
markers = ["project.manifest"]
source_roots = ["src"]
timeout_secs = 900
env = {}

[release]
platform = "kubernetes"
ci = "github-actions"
deploy_root = "deploy"
docs_root = "docs"
build_command = ""
package_command = ""
artifact_paths = []
# rl-01 is the happy path, so `release-docs-cover` has to run rather than
# skip: an unset command skips the check, the gate still reports PASS, and
# the signoff then reads 9 of 10. `sh` prefix because the gate spawns
# through the platform shell and `cmd` cannot execute a shebang script.
api_symbols_command = "sh ci/api-symbols"
image_name = "registry.example.invalid/checkout"
service_port = 8080

[[verifier]]
name = "deferral-auditor"
phase = "release"
report_field = "verifiers.deferrals"
unit = "deferrals"
required = true
