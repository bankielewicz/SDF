schema = "devforgeai/gates/1"
cli_min_version = "1.0.0"

[[gate]]
phase = "build"
requires = "plan"
on_fail = "fail"
send_back_to = "plan"
description = "Story implemented, tests green, coverage by layer met, lint clean."

  [[gate.check]]
  kind = "doc_valid"
  id = "build-docs"
  docs = ["stories/{id}.md"]
  on_fail = "send_back"

  [[gate.check]]
  kind = "field_in_enum"
  id = "build-status"
  path = "stories/{id}.md"
  field = "status"
  values = ["building", "built"]

  [[gate.check]]
  kind = "tests_pass"
  id = "build-tests"
  stacks = []
  allow_empty = false

  [[gate.check]]
  kind = "coverage_min"
  id = "build-coverage"
  layers = ["domain", "application", "infrastructure", "interface"]
  overall = true
  source = "run"

  [[gate.check]]
  kind = "lint_clean"
  id = "build-lint"
  stacks = []

  [[gate.check]]
  kind = "design_tokens"
  id = "build-design"
  paths = []
  severity = "warn"

  [[gate.check]]
  kind = "complexity_clean"
  id = "build-complexity"
  stacks = []
  severity = "warn"

  [[gate.check]]
  kind = "files_declared"
  id = "build-files"
  message = "{value} is outside the declared file set of {id}"

  [[gate.check]]
  kind = "antipattern_clean"
  id = "build-antipatterns"
  min_severity = "high"
  scope = "story"

  [[gate.check]]
  kind = "verifier_pass"
  id = "build-testable"
  verifiers = ["ac-test-writer"]
  min_ratio = 1.0
  on_fail = "send_back"

  [[gate.check]]
  kind = "verifier_pass"
  id = "build-context"
  verifiers = ["context-validator"]
  min_ratio = 1.0

  [[gate.check]]
  kind = "verifier_pass"
  id = "build-acs"
  verifiers = ["story-ac-verifier"]
  min_ratio = 1.0
  on_fail = "send_back"
