schema = "devforgeai/config/1"
generated_at = "2026-09-11T09:14:02Z"
cli_version = "1.0.0"
degraded = false

# The gate spawns a configured command through the platform shell, and
# on Windows `cmd` cannot execute a shebang script: `./ci/test` is
# DFA-E311 there and works from bash, which is how it passed a manual
# check and failed a real run. `sh ci/test` runs the same script on
# both platforms.
[[stack]]
id = "primary"
markers = ["project.manifest"]
package_manager = ""
source_roots = ["src"]
test_command = "sh ci/test"
coverage_command = "sh ci/coverage"
coverage_format = "cobertura"
coverage_paths = ["coverage/cobertura.xml"]
lint_command = "sh ci/lint"
complexity_command = "sh ci/complexity"
timeout_secs = 900
env = {}

[build]
worktree_root = "wt"
branch_prefix = "story/"
base_ref = "HEAD"
complexity_max = 10
duplication_max_percent = 5.0

[frontend]
globs = ["**/*.css", "**/*.html"]
tokens_path = ".devforgeai/brand/tokens.json"
exclude = ["**/vendor/**", ".explore-prototype/**", ".devforgeai/explore/mockups/**"]

[[layer]]
name = "domain"
globs = ["**/domain/**", "**/entities/**"]
coverage_min = 95.0

[[layer]]
name = "application"
globs = ["**/application/**", "**/services/**", "**/usecases/**"]
coverage_min = 85.0

[[layer]]
name = "infrastructure"
globs = ["**/infrastructure/**", "**/adapters/**", "**/repositories/**"]
coverage_min = 80.0

[[layer]]
name = "interface"
globs = ["**/api/**", "**/controllers/**", "**/routes/**", "**/cli/**", "**/ui/**", "**/components/**", "**/pages/**"]
coverage_min = 70.0

[coverage]
overall_min = 80.0
unassigned_policy = "report"
exclude = ["**/tests/**", "**/*_spec.*"]

[[verifier]]
name = "ac-test-writer"
phase = "build"
report_field = "verifiers.ac_testable"
unit = "AC"
required = true

[[verifier]]
name = "story-ac-verifier"
phase = "build"
report_field = "verifiers.story_ac"
unit = "ACs"
required = true

[[verifier]]
name = "context-validator"
phase = "build"
report_field = "verifiers.context"
unit = "files"
required = true
